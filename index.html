    <!--
      Politique de sécurité du contenu.

      Le dépôt ne définissait aucun en-tête de sécurité, et l'hébergement n'a pas
      de fichier de configuration : le filet qui rattrape une injection de script
      n'existait pas. Un `<meta http-equiv>` est le seul endroit qui fonctionne
      quel que soit l'hébergeur, d'où ce choix plutôt qu'un fichier d'en-têtes
      seul — `public/_headers` le complète pour les plateformes qui le lisent, et
      porte ce que la balise ne peut pas exprimer (`frame-ancestors`, HSTS).

      Les sources sont larges là où elles doivent l'être. `script-src` accepte
      l'inline parce que la page en contient un, exécuté avant le premier rendu
      pour détecter les consoles et les TV, et parce que la régie publicitaire en
      injecte. Ce n'est donc pas une protection contre le XSS injecté dans notre
      propre page ; ce que ça bloque, en revanche, c'est le chargement d'un script
      depuis un domaine inconnu, l'exfiltration vers un point de collecte
      arbitraire, l'injection d'objets Flash ou de `<base>`, et la soumission d'un
      formulaire ailleurs que chez nous. Autrement dit, la moitié utile du travail
      pour un coût de rupture nul.

      À faire évoluer si un jour tout l'inline disparaît : remplacer
      'unsafe-inline' par des empreintes et la protection devient réelle.
    -->

      http-equiv="Content-Security-Policy"
      content="

    <div id="root"></div>
    <!-- Detect consoles / TVs / low-RAM BEFORE first paint so heavy effects are
         disabled from the start (avoids Xbox browser stutter & crashes). -->
    <script>
      (function () {
        try {
          var ua = (navigator.userAgent || '').toLowerCase();
          var consoleTv = /(xbox|playstation|nintendo|smart-?tv|smarttv|tizen|web0s|webos|netcast|hbbtv|viera|bravia|aquos|googletv|android tv|crkey|dtv)/.test(ua);
          var lowMem = typeof navigator.deviceMemory === 'number' && navigator.deviceMemory > 0 && navigator.deviceMemory <= 3;
          var e = document.documentElement;
          if (consoleTv) { e.classList.add('tv-mode', 'low-power'); }
          else if (lowMem) { e.classList.add('low-power'); }
        } catch (_) { /* noop */ }
      })();
    </script>
